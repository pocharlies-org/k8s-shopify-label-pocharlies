# ExternalSecrets for the tracking opt-in workers (2026-06-11).
#
# These two were hand-created with kubectl while the Vault admin token was
# unavailable; the secret material now lives in Vault (populated via a
# break-glass generate-root, immediately revoked) so the cluster is fully
# reproducible from git. The eso-read policy already grants secret/data/* so
# no policy change was needed.
#
#   secret/skirmshop/labels-telegram-track-bot  → @SkirmshopTrackBot bot token
#   secret/skirmshop/labels-wa-reader           → read-only labels_wa_reader DSN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: labels-telegram-track-bot
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: labels-telegram-track-bot
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: { key: secret/skirmshop/labels-telegram-track-bot }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: labels-wa-reader
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: labels-wa-reader
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: { key: secret/skirmshop/labels-wa-reader }
