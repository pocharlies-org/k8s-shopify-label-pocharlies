apiVersion: batch/v1
kind: CronJob
metadata:
  name: labels-pickup-point-reminder
  namespace: skirmshop
spec:
  schedule: "*/2 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: labels-pickup-point-reminder
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          nodeSelector: { kubernetes.io/arch: amd64 }
          containers:
            - name: pickup-point-reminder
              image: harbor.e-dani.com/homelab/skirmshop-labels-pickup-point-reminder@sha256:394485284a9f1dead0b9e214c375c7a1a6530a148ee785107477481fcbfb9d0d # pin por digest — SKIRM-322: v2026.10.28.7 (skirmshop-labels eef1e166c1364c50a21dea83085db7c46dd227d7, release 40708004799): pone y quita el hold de Shopify «Falta el punto de recogida» (ledger pickup_point_shopify_hold) cuando PICKUP_SHOPIFY_HOLD_ENABLED=true.
              env:
                - {
                    name: PG_URL,
                    value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/labels",
                  }
                - {
                    name: DATABASE_URL,
                    value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/labels",
                  }
                - name: OPS_TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: labels-telegram-bot
                      key: bot_token
                - { name: OPS_TELEGRAM_CHAT_ID, value: "-1003984393379" }
                - { name: OPS_TELEGRAM_LABELS_THREAD_ID, value: "6921" }
                - { name: OPS_TELEGRAM_ENABLED, value: "false" }
                - {
                    name: PICKUP_REMINDER_ADMIN_BASE_URL,
                    value: "https://track.skirmshop.es/labels",
                  }
                - {
                    name: PICKUP_REMINDER_PICKUP_SELECTOR_URL_BASE,
                    value: "https://track.skirmshop.es/labels/track",
                  }
                - {
                    name: PICKUP_REMINDER_PUBLIC_TRACKING_URL_BASE,
                    value: "https://track.skirmshop.es/labels/track",
                  }
                - { name: PICKUP_CUSTOMER_NOTIFICATIONS_ENABLED, value: "true" }
                - { name: PICKUP_CUSTOMER_REMINDER_DELAY_MINUTES, value: "2" }
                - {
                    name: NOTIFICATION_DISPATCHER_URL,
                    value: "http://labels-notification-dispatcher.skirmshop.svc.cluster.local:3007",
                  }
                # SKIRM-322: hold «Falta el punto de recogida» en Shopify vía el servicio de fulfillment.
                - {
                    name: SHOPIFY_FULFILLMENT_SERVICE_URL,
                    value: "http://labels-shopify-fulfillment-service.skirmshop.svc.cluster.local:3005",
                  }
                - { name: PICKUP_SHOPIFY_HOLD_ENABLED, value: "false" }
              envFrom: [{ secretRef: { name: labels-secrets } }]
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
