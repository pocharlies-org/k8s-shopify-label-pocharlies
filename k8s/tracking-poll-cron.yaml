apiVersion: batch/v1
kind: CronJob
metadata:
  name: labels-tracking-poll-scheduler
  namespace: skirmshop
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: labels-tracking-poll-scheduler
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          nodeSelector: { kubernetes.io/arch: amd64 }
          containers:
            - name: tracking-poll-scheduler
              # Promoted to a first-class app (was the saga-launcher image running an
              # inline ConfigMap .mjs). Adds dedup + max-attempts + min-interval + max-age
              # guards that stop the unbounded "new poll instance every 15 min" growth.
              # poll-tracking v1.3.1 publishes TrackingEventReceived through the
              # event gateway so tracking-ingestion persists carrier movement.
              image: harbor.e-dani.com/homelab/skirmshop-labels-tracking-poll-scheduler@sha256:3c2c50e8b02ccee5221a24ad2503c2f8291ec99e8af9587581d57675f8bd5536
              env:
                - { name: PG_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/labels" }
                - { name: SYNAPSE_API_URL, value: "http://labels-synapse-api.skirmshop.svc.cluster.local:8080" }
                - { name: POLL_TRACKING_WORKFLOW_NAMESPACE, value: "skirmshop" }
                - { name: POLL_TRACKING_WORKFLOW_NAME, value: "poll-tracking" }
                - { name: POLL_TRACKING_WORKFLOW_VERSION, value: "1.3.4" }
                - { name: POLL_TRACKING_BATCH_SIZE, value: "100" }
                - { name: REQUEST_TIMEOUT_MS, value: "15000" }
                # --- dedup / back-pressure guards (the fix) ---
                - { name: POLL_MIN_INTERVAL_MINUTES, value: "90" }
                - { name: POLL_MAX_ATTEMPTS, value: "32" }
                - { name: POLL_MAX_AGE_DAYS, value: "21" }
              envFrom: [{ secretRef: { name: labels-secrets } }]
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
