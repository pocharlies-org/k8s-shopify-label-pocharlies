# Deep monitor for the order-page label buttons (order-label-action modal +
# order-label-link). Active-probe CronJob every 15m: checks deployment health,
# greps recent error logs, and smoke-tests the 3 endpoints in-cluster (bypassing
# Cloudflare). Complete runs publish result + heartbeat gauges to VictoriaMetrics;
# VMRule/Alertmanager owns alert state and Telegram delivery.
# Image alpine/k8s ships kubectl + curl + jq + bash → no custom image to build.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: labels-deep-monitor
  namespace: skirmshop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: labels-deep-monitor
  namespace: skirmshop
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: labels-deep-monitor
  namespace: skirmshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: labels-deep-monitor
subjects:
  - kind: ServiceAccount
    name: labels-deep-monitor
    namespace: skirmshop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: labels-deep-monitor-script
  namespace: skirmshop
data:
  monitor.sh: |
    #!/usr/bin/env bash
    # Deep monitor: pod health + log errors + in-cluster smoke of the order-page
    # label buttons. Results are persisted as metrics; delivery is external.
    set -uo pipefail
    NS="${NS:-skirmshop}"
    DEPLOY="${DEPLOY:-labels-shopify-app}"
    SVC="${SVC:-http://labels-shopify-app.skirmshop.svc.cluster.local:3004}"
    ORIGIN="${ORIGIN:-https://extensions.shopifycdn.com}"
    ENC="${ENC:-gid%253A%252F%252Fshopify%252FOrder%252F1}"
    THRESH="${LOG_ERROR_THRESHOLD:-25}"
    VM_URL="${VICTORIAMETRICS_URL:-http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428}"
    incidents=""; execution_errors=""; report=""; incident_count=0

    note(){ report+="$1"$'\n'; echo "$1"; }
    inc(){ incident_count=$((incident_count + 1)); incidents+="• $1"$'\n'; echo "INCIDENT: $1" >&2; }
    execution_error(){ execution_errors+="• $1"$'\n'; echo "EXECUTION_ERROR: $1" >&2; }

    for dependency in kubectl curl jq awk grep date; do
      command -v "$dependency" >/dev/null 2>&1 || execution_error "dependencia ausente: $dependency"
    done
    [[ "$THRESH" =~ ^[0-9]+$ ]] || execution_error "LOG_ERROR_THRESHOLD no es numérico: $THRESH"
    if [ -n "$execution_errors" ]; then
      echo "=== EXECUTION ERROR ==="; printf '%s' "$execution_errors"; exit 2
    fi

    push_metrics(){
      local body="$1" attempt
      for attempt in 1 2 3; do
        if printf '%s' "$body" | curl -fsS -o /dev/null -m 15 \
          -H 'Content-Type: text/plain' --data-binary @- \
          "${VM_URL%/}/api/v1/import/prometheus?extra_label=job=labels_deep_monitor"; then
          echo "metrics: delivered attempt=${attempt}"
          return 0
        fi
        echo "metrics: delivery failed attempt=${attempt}/3" >&2
        [ "$attempt" -lt 3 ] && sleep $((attempt * 2))
      done
      return 1
    }

    # --- A. deployment health ---
    deploy_json="$(mktemp)"; deploy_err="$(mktemp)"
    if kubectl -n "$NS" get deploy "$DEPLOY" -o json >"$deploy_json" 2>"$deploy_err"; then
      desired=$(jq -r '.spec.replicas // 1' "$deploy_json" 2>/dev/null) || execution_error "JSON inválido al leer deployment $DEPLOY"
      ready=$(jq -r '.status.readyReplicas // 0' "$deploy_json" 2>/dev/null) || execution_error "JSON inválido al leer readyReplicas de $DEPLOY"
      specimg=$(jq -r '.spec.template.spec.containers[0].image // "?"' "$deploy_json" 2>/dev/null) || execution_error "JSON inválido al leer imagen de $DEPLOY"
      note "deploy ready=${ready}/${desired}"
      note "image=${specimg##*@}"
      [ "$ready" != "$desired" ] && inc "réplicas no listas: ${ready}/${desired}"
    else
      if grep -q 'NotFound' "$deploy_err"; then
        inc "deployment $DEPLOY no encontrado"
      else
        execution_error "kubectl no pudo leer deployment $NS/$DEPLOY"
      fi
    fi
    pods_json="$(mktemp)"
    if kubectl -n "$NS" get pods -l app="$DEPLOY" -o json >"$pods_json" 2>/dev/null; then
      pod_count=$(jq -r '.items | length' "$pods_json" 2>/dev/null) || execution_error "JSON inválido al leer pods de $DEPLOY"
      restarts=$(jq -r '[.items[].status.containerStatuses[]?.restartCount] | join(" ")' "$pods_json" 2>/dev/null) || execution_error "JSON inválido al leer restarts de $DEPLOY"
      note "restarts=[${restarts}]"
      [ "${pod_count:-0}" -eq 0 ] 2>/dev/null && inc "deployment $DEPLOY sin pods"
      for r in $restarts; do [ "${r:-0}" -gt 5 ] 2>/dev/null && inc "pod con restartCount=${r} (>5)"; done
    else
      execution_error "kubectl no pudo listar pods de $NS/$DEPLOY"
    fi

    # --- B. in-cluster smoke (bypass Cloudflare) ---
    opts_code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X OPTIONS "$SVC/api/shipments/$ENC" -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,content-type" || true)
    opts_acao=$(curl -s -o /dev/null -D - -m 15 -X OPTIONS "$SVC/api/shipments/$ENC" -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
    note "preflight: code=${opts_code} acao=${opts_acao:-<none>}"
    { [ "$opts_code" = "204" ] && [ "$opts_acao" = "$ORIGIN" ]; } || inc "CORS preflight roto (code=${opts_code} acao=${opts_acao:-none}; esperado 204 + ${ORIGIN})"

    ol_code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$SVC/admin/order-label?id=12345" || true)
    note "order-label: code=${ol_code}"
    [ "$ol_code" = "200" ] || inc "ruta order-label rota (code=${ol_code}; esperado 200)"

    sh_code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$SVC/api/shipments/$ENC" -H "Origin: $ORIGIN" || true)
    sh_acao=$(curl -s -o /dev/null -D - -m 15 "$SVC/api/shipments/$ENC" -H "Origin: $ORIGIN" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
    note "gated GET: code=${sh_code} acao=${sh_acao:-<none>}"
    [ "$sh_code" = "200" ] && inc "SEGURIDAD: /api/shipments devuelve 200 SIN auth (gate JWT roto)"
    { [ "$sh_code" = "401" ] || [ "$sh_code" = "403" ]; } || inc "/api/shipments code inesperado=${sh_code} (esperado 401/403)"
    [ -n "${sh_acao:-}" ] || inc "falta cabecera CORS en respuesta gated de /api/shipments"

    # --- C. error logs (last 12h, feature-scoped) ---
    raw_logs="$(mktemp)"
    if kubectl -n "$NS" logs -l app="$DEPLOY" --tail=5000 --since=12h >"$raw_logs" 2>/dev/null; then
      errlines=$(grep '"level":"error"' "$raw_logs" | grep -iE 'shipment|extension-cors|retry|saga|label|cors' || true)
      errcount=$(printf '%s' "$errlines" | grep -c . || true); errcount=${errcount:-0}
      note "error-logs(12h, feature)=${errcount}"
      [ "$errcount" -gt "$THRESH" ] 2>/dev/null && inc "${errcount} errores en logs (12h) sobre shipments/cors/saga (>${THRESH})"
    else
      execution_error "kubectl no pudo leer logs de $NS/$DEPLOY"
      errlines=""
    fi

    # --- verdict + durable telemetry ---
    if [ -n "$execution_errors" ]; then
      echo "=== EXECUTION ERROR ==="; printf '%s' "$execution_errors"; exit 2
    fi
    check_ok=1; [ -n "$incidents" ] && check_ok=0
    run_ts=$(date +%s) || { echo "EXECUTION_ERROR: no se pudo obtener timestamp" >&2; exit 2; }
    metrics=$(printf 'labels_deep_monitor_check_ok{namespace="skirmshop",cronjob="labels-deep-monitor"} %s %s000\nlabels_deep_monitor_incident_count{namespace="skirmshop",cronjob="labels-deep-monitor"} %s %s000\nlabels_deep_monitor_last_run_timestamp_seconds{namespace="skirmshop",cronjob="labels-deep-monitor"} %s %s000\n' \
      "$check_ok" "$run_ts" "$incident_count" "$run_ts" "$run_ts" "$run_ts")
    push_metrics "$metrics" || { echo "EXECUTION_ERROR: no se pudo persistir el resultado" >&2; exit 2; }
    if [ "$check_ok" -eq 0 ]; then
      [ -n "$errlines" ] && echo "--- error log sample ---" && printf '%s\n' "$errlines" | tail -8
      echo "=== INCIDENTE PUBLICADO ==="; printf '%s' "$incidents"
      exit 0
    fi
    echo "=== OK ==="; printf '%s' "$report"
    exit 0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: labels-deep-monitor
  namespace: skirmshop
  # Monitoreo del rollout de los botones de etiqueta en la página de pedido.
spec:
  schedule: "*/15 * * * *" # cada 15 minutos; alertas derivadas de métricas
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0 # un fallo aquí significa error de ejecución/telemetría, no incidente del target
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: labels-deep-monitor
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          serviceAccountName: labels-deep-monitor
          nodeSelector: { kubernetes.io/arch: amd64 }
          containers:
            - name: deep-monitor
              image: alpine/k8s:1.32.5 # kubectl + curl + jq + bash (Kyverno-clean, ya cacheada)
              command: ["bash", "/scripts/monitor.sh"]
              env:
                - { name: HOME, value: "/tmp" }
                - { name: VICTORIAMETRICS_URL, value: "http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428" }
                # Umbral con margen sobre el baseline observado (~7 errores/12h)
                # para evitar flapping; el conteo real queda en los logs del job.
                - { name: LOG_ERROR_THRESHOLD, value: "25" }
              volumeMounts:
                - { name: script, mountPath: /scripts, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
          volumes:
            - name: script
              configMap: { name: labels-deep-monitor-script, defaultMode: 0555 }
            - name: tmp
              emptyDir: {}
