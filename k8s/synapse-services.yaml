apiVersion: apps/v1
kind: Deployment
metadata:
  name: labels-correos-express-adapter
  namespace: skirmshop
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: labels-correos-express-adapter } }
  template:
    metadata: { labels: { app: labels-correos-express-adapter } }
    spec:
      enableServiceLinks: false
      nodeSelector: { role: edge, kubernetes.io/arch: amd64 }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: correos-express-adapter
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 10"] }
          image: harbor.e-dani.com/homelab/skirmshop-labels-correos-express-adapter@sha256:fa335c8d6cab85d3f0dda52447e648a1f16e77369493ca6d38a2f6a344d0d9cb
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
            - {
                name: PG_URL,
                value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/labels",
              }
            - {
                name: LABEL_STORAGE_URL,
                value: "http://labels-label-storage.skirmshop.svc.cluster.local:3007",
              }
            # CEX integración confirmed canalEntrada=1 for Skirmshop pararEntrega on 2026-05-26.
            - { name: CEX_PARAR_CANAL_ENTRADA, value: "1" }
            # Tarifa contractual y recargos viven en ConfigMaps editables desde el admin.
            # El adapter re-lee ambos ficheros en cada /rate, así que un patch del
            # ConfigMap se ve en <60s sin reinicio del pod (kubelet auto-remonta).
            - {
                name: CEX_RATE_TABLE_FILE,
                value: "/etc/cex/rate-table/rate-table.json",
              }
            - {
                name: CEX_SURCHARGES_FILE,
                value: "/etc/cex/surcharges/surcharges.json",
              }
          envFrom:
            - { secretRef: { name: labels-secrets } }
            - { secretRef: { name: labels-cex-secrets } }
          volumeMounts:
            # Directory mounts (NOT subPath: ...) so kubelet auto-refreshes
            # the files when the ConfigMap is patched. ConfigMaps project
            # rate-table.json + surcharges.json into /etc/cex/ and the
            # adapter's /rate handler re-reads them every request.
            - {
                name: cex-rate-table,
                mountPath: /etc/cex/rate-table,
                readOnly: true,
              }
            - {
                name: cex-surcharges,
                mountPath: /etc/cex/surcharges,
                readOnly: true,
              }
          resources:
            requests: { cpu: 30m, memory: 96Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
      volumes:
        - name: cex-rate-table
          configMap: { name: labels-cex-rate-table }
        - name: cex-surcharges
          configMap: { name: labels-cex-surcharges }
---
