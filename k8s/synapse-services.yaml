apiVersion: apps/v1
kind: Deployment
metadata:
  name: labels-tracking-ingestion
  namespace: skirmshop
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: labels-tracking-ingestion } }
  template:
    metadata: { labels: { app: labels-tracking-ingestion } }
    spec:
      enableServiceLinks: false
      nodeSelector: { role: edge, kubernetes.io/arch: amd64 }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: tracking-ingestion
          image: harbor.e-dani.com/homelab/skirmshop-labels-tracking-ingestion@sha256:7bf496613d437910f4c5fc726a2b1548ca0c0f6cc0e953219bc279e77ca5a372 # pin por digest — 6252d58 (tag nats-liveness-20260713-1419): reconexión NATS ilimitada
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
            - {
                name: PG_URL,
                value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/labels",
              }
            - {
                name: NATS_URL,
                value: "nats://labels-nats-cluster.skirmshop.svc.cluster.local:4222",
              }
            - { name: NATS_STREAM, value: "SHIPPING_EVENTS" }
            # Customer-notify fan-out (replaces the never-wired
            # handle-tracking-event workflow). TRACK_TOKEN_SECRET +
            # PUBLIC_TRACKING_URL_BASE arrive via labels-secrets.
            - { name: TRACKING_NOTIFY_ENABLED, value: "true" }
          envFrom: [{ secretRef: { name: labels-secrets } }]
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          # Probe params are LOAD-BEARING for the consumer-resilience contract
          # (PR skirmshop-labels#37): /ready turns 503 when NATS is down, the
          # JetStream iterator died, or the consumer sat idle >READY_MAX_IDLE_S
          # (120s) with backlog pending; the supervisor exits(1) after
          # exhausting resubscribe attempts. readiness 10s×3 = out of Endpoints
          # in ~30s; liveness on /health recycles a hung process that never
          # reaches the exit path. replicas stays 1 (shared-durable multi-pull
          # is unvalidated); the exit+liveness pair bounds the blackout to the
          # restart window instead of the 9h silent-mute of 2026-06-11.
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
