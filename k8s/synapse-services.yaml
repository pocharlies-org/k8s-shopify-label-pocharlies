apiVersion: apps/v1
kind: Deployment
metadata:
  name: labels-notification-dispatcher
  namespace: skirmshop
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: labels-notification-dispatcher } }
  template:
    metadata: { labels: { app: labels-notification-dispatcher } }
    spec:
      enableServiceLinks: false
      nodeSelector: { role: edge, kubernetes.io/arch: amd64 }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      # Run as uid 1000 to read the host /etc/synapse/credentials/*.rmq.password
      # files (owned 1000:1000, mode 0600) — same access the picker has. The
      # EmailSynapseChannel needs skirmshop_picker.rmq.password to publish.
      securityContext: { runAsUser: 1000, runAsGroup: 1000 }
      containers:
        - name: notification-dispatcher
          image: harbor.e-dani.com/homelab/skirmshop-labels-notification-dispatcher@sha256:ad0e4b695f2c2af175c215e44ae61ea01ddb863a11a396bafe401848802cccce
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
            - { name: SHOPIFY_SHOP_DOMAIN, value: "ymimst-yh.myshopify.com" }
            - {
                name: PG_URL,
                value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/labels",
              }
            - { name: NOTIFICATIONS_ENABLED, value: "true" }
            - { name: EMAIL_ENABLED, value: "true" }
            - { name: PICKUP_EMAIL_ENABLED, value: "true" }
            # EmailSynapseChannel publishes messaging.skirmshop.send to the
            # synapse broker using the skirmshop_picker hostPath credential
            # (same pattern as the picker; this pod is already pinned role:edge
            # where /etc/synapse/credentials lives).
            - { name: AMQP_HOST, value: "synapse-rmq.databases.svc.cluster.local" }
            - { name: AMQP_PORT, value: "5672" }
            - { name: AMQP_VHOST, value: "/synapse" }
            - { name: AMQP_USER, value: "skirmshop_picker" }
            - { name: WHATSAPP_ENABLED, value: "true" }
            - { name: WHATSAPP_TRANSPORT, value: "http" }
            - { name: WHATSAPP_CLOUD_API_VERSION, value: "v21.0" }
            - { name: WHATSAPP_CLOUD_PHONE_NUMBER_ID, value: "" }
            - { name: WHATSAPP_CLOUD_ACCESS_TOKEN, value: "" }
            - { name: WHATSAPP_CLOUD_WABA_ID, value: "" }
            - {
                name: WHATSAPP_HTTP_URL,
                value: "http://whatsapp-connector-professional.whatsapp-mcp.svc.cluster.local:3001",
              }
            - name: WHATSAPP_CONNECTOR_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  {
                    name: labels-socialmedia-secrets,
                    key: CONNECTOR_SHARED_SECRET,
                  }
            - { name: TELEGRAM_ENABLED, value: "true" }
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  { name: labels-telegram-track-bot, key: TELEGRAM_BOT_TOKEN }
            - {
                name: LABEL_STORAGE_URL,
                value: "http://labels-label-storage.skirmshop.svc.cluster.local:3007",
              }
            - {
                name: SHOPIFY_APP_URL,
                value: "https://track.skirmshop.es/labels",
              }
            - { name: PUBLIC_WHATSAPP_NUMBER_E164, value: "+34628534490" }
            - { name: SHOPIFY_ADMIN_STORE, value: "skirmshop-spain" }
            - { name: OPS_TELEGRAM_ENABLED, value: "false" }
            - { name: OPS_TELEGRAM_CHAT_ID, value: "-1003984393379" }
            - { name: OPS_TELEGRAM_LABELS_THREAD_ID, value: "6921" }
            - name: OPS_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: { name: labels-telegram-bot, key: bot_token }
          envFrom: [{ secretRef: { name: labels-secrets } }]
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 10
          volumeMounts:
            - { name: synapse-credentials, mountPath: /etc/synapse/credentials, readOnly: true }
      volumes:
        - name: synapse-credentials
          hostPath: { path: /etc/synapse/credentials, type: Directory }
