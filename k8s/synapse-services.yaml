apiVersion: apps/v1
kind: Deployment
metadata:
  name: labels-correos-adapter
  namespace: skirmshop
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: labels-correos-adapter } }
  template:
    metadata: { labels: { app: labels-correos-adapter } }
    spec:
      enableServiceLinks: false
      nodeSelector: { role: edge, kubernetes.io/arch: amd64 }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: correos-adapter
          image: harbor.e-dani.com/homelab/skirmshop-labels-correos-adapter@sha256:7e17d4adb0351d5f7fbca5ff5766ac453e9593b1ead9930652ccfa099c7e62ae # pin por digest — main 542b423 (tag correos-estimate-widget-20260628-2131): módulo directory/ + GET /service-points (PR #38) + fallback nearest-in-province (CP sin punto exacto, ej 08753, devuelve los más cercanos de la provincia)
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
            - {
                name: PG_URL,
                value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/labels",
              }
            - {
                name: NATS_URL,
                value: "nats://labels-nats-cluster.skirmshop.svc.cluster.local:4222",
              }
            - {
                name: LABEL_STORAGE_URL,
                value: "http://labels-label-storage.skirmshop.svc.cluster.local:3007",
              }
            # Fuel surcharge Correos matriz (tabla NETA + % mensual). Releído
            # por request → hot-reload del ConfigMap sin restart.
            - {
                name: CORREOS_SURCHARGES_FILE,
                value: /etc/correos/surcharges/surcharges.json,
              }
            # Recogidas (RCG) base URL — SITCE caso 23950054: logistics/requests
            # (no support/requests = urlgen/QR). Override explícito: labels-secrets
            # traía el valor viejo support/requests y pisaba el default del código.
            - {
                name: CORREOS_REQUESTS_BASE_URL_PROD,
                value: "https://api1.correos.es/logistics/requests/api/v1",
              }
            - {
                name: CORREOS_REQUESTS_BASE_URL_PRE,
                value: "https://api1.correospre.es/logistics/requests/api/v1",
              }
            # Identificadores de contrato de recogidas (RCG) — caso 23950054.
            # Ahora son DEFAULTS en el código (config.ts, PR #73): codContract
            # 54097436, codSpecificContract base 81619716 (la API lo eco como
            # "9981619716"), codAnnex 091. Confirmados por SITCE y probados en
            # create+cancel real (2026-06-18). No hace falta env aquí; añade un
            # override SOLO si cambia el contrato/tenant.
            # Service-point directory (oficinas + Citypaq). El nodo edge NO corre
            # CSI → emptyDir: el adapter auto-descarga el ZIP público de Correos
            # al arrancar + cada 24h, y el CronJob labels-correos-directory-refresh
            # fuerza un POST /service-points/refresh diario determinista.
            - { name: CORREOS_DIRECTORY_MODE, value: "file" }
            - {
                name: CORREOS_DIRECTORY_DATA_PATH,
                value: /data/correos-service-points.csv,
              }
          envFrom: [{ secretRef: { name: labels-secrets } }]
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
          volumeMounts:
            # Directorio completo (NO subPath): el kubelet remonta el ConfigMap
            # editado (~60s) y el adapter lo relee en el siguiente /rate.
            - { name: correos-surcharges, mountPath: /etc/correos/surcharges, readOnly: true }
            - { name: directory-cache, mountPath: /data }
      volumes:
        - name: correos-surcharges
          configMap:
            name: labels-correos-surcharges
            # optional: el loader cae a defaults (fuel 0%) si falta el CM y el
            # pod debe arrancar aunque el ConfigMap aún no exista.
            optional: true
        # Cache del directorio de service points (se repuebla solo al arrancar).
        - { name: directory-cache, emptyDir: {} }
---
