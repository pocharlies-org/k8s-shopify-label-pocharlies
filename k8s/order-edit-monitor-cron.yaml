apiVersion: batch/v1
kind: CronJob
metadata:
  name: labels-order-edit-monitor
  namespace: skirmshop
  # TEMPORARY: one-week post-launch validation of customer order-editing.
  # Self-no-ops after MONITOR_END_DATE; DELETE this CronJob after 2026-06-25.
spec:
  schedule: "0 */6 * * *" # every 6h UTC; heartbeat once/day at the 06:00 run
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: labels-order-edit-monitor
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          nodeSelector: { kubernetes.io/arch: amd64 }
          containers:
            - name: order-edit-monitor
              image: harbor.e-dani.com/homelab/skirmshop-order-edit-monitor@sha256:ec0b1264f3825d4be4d7549eb8eee344bef49aefce38149395f6248b0ecf44ff
              env:
                - {
                    name: PG_URL,
                    value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/labels",
                  }
                # ymimst-yh is the real prod shop (labels-secrets carries the
                # internal handle skirmshop-spain); explicit env wins over envFrom.
                - { name: SHOPIFY_SHOP_DOMAIN, value: "ymimst-yh.myshopify.com" }
                - { name: SHOPIFY_API_VERSION, value: "2026-04" }
                - name: OPS_TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: labels-telegram-bot
                      key: bot_token
                - { name: OPS_TELEGRAM_CHAT_ID, value: "-1003984393379" }
                - { name: OPS_TELEGRAM_LABELS_THREAD_ID, value: "6921" }
                - { name: PICQER_BASE_URL, value: "https://skirmshop.picqer.com/api/v1" }
                - { name: PICQER_USER_AGENT, value: "SkirmshopLabels (info@e-dani.com)" }
                # Internal Service (bypasses Cloudflare, which 403s a non-browser
                # OPTIONS): authoritative check that the order-edit routes are
                # registered on the running app.
                - {
                    name: ORDER_EDIT_PUBLIC_BASE,
                    value: "http://labels-shopify-app.skirmshop.svc.cluster.local:3004/api/customer/order-edit",
                  }
                - { name: MONITOR_END_DATE, value: "2026-06-25" }
                - { name: TEST_ORDER_GID, value: "gid://shopify/Order/7601510842709" }
                - { name: TEST_CUSTOMER_ID, value: "10219036574037" }
                - { name: LOOKBACK_HOURS, value: "8" }
                - { name: HEARTBEAT_HOUR_UTC, value: "6" }
                # SHOPIFY_API_KEY/SECRET, PICQER_API_KEY, DB_USER/PASSWORD via envFrom.
              envFrom: [{ secretRef: { name: labels-secrets } }]
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
