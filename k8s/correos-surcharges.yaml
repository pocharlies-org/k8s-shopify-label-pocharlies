# Correos matriz surcharges — editable sin rebuild (mismo patrón que
# labels-cex-surcharges). Los precios de la tabla contractual de Correos son
# NETOS: la oferta de Emilio Torres (27/04/2026) suma un suplemento de
# combustible que varía mes a mes. Correos matriz NO lo comunica por email: el %
# del mes sale en su factura mensual («Supl. combustible N %», facturas.clientes@correos.com).
#
# Los campos fuel los escribe .github/workflows/fuel-sync.yml (SKIRM-312). El
# adapter relee el fichero montado en cada /rate → llega a checkout en <60s. El mount es de
# DIRECTORIO completo (no subPath) o el kubelet no refresca.
apiVersion: v1
kind: ConfigMap
metadata:
  name: labels-correos-surcharges
  namespace: skirmshop
  annotations:
    skirmshop.labels/loaded-at: "2026-10-27"
    skirmshop.labels/fuel-source: "Correos matriz - factura N.4004809070 (30/09/2026)"
data:
  surcharges.json: |
    {
      "fuel_surcharge_pct": 9.4,
      "fuel_surcharge_effective_from": "2026-10-01",
      "fuel_surcharge_source": "Correos matriz - factura N.4004809070 30/09/2026: Supl. combustible 9,4% (septiembre); octubre se confirma con su factura"
    }
