# Monitoring for the skirmshop-labels tracking pipeline.
#
# Until 2026-06-10 the alert rules for this system only existed as an
# unapplied PrometheusRule inside the monorepo (infra/monitoring/), and the
# labels services were never scraped — the tracking-ingestion bad-event storm
# that silently dropped every CEX poll for weeks was invisible. This file is
# the deployed source of truth: VMServiceScrapes for the two services whose
# metrics back the alerts, plus the VMRule (ns monitoring, where VMAlert
# loads rules from).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: labels-tracking-ingestion
  namespace: skirmshop
spec:
  selector:
    matchLabels:
      app: labels-tracking-ingestion
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: labels-synapse-janitor
  namespace: skirmshop
spec:
  selector:
    matchLabels:
      app: labels-synapse-janitor
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# labels-shopify-app exposes /metrics (prom-client) on its http port (3004 →
# container 3000) but was never scraped. Without this the public tracking-page
# 404 rate (route="/track/:trackingNumber") is invisible — the TrackingPage404Spike
# rule below depends on these series landing in VictoriaMetrics. Added 2026-06-23.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: labels-valkey
  namespace: skirmshop
spec:
  selector:
    matchLabels:
      metrics.e-dani.com/scrape: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: labels-shopify-app
  namespace: skirmshop
spec:
  selector:
    matchLabels:
      app: labels-shopify-app
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: skirmshop-labels
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: skirmshop-labels
spec:
  groups:
    - name: skirmshop-labels-tracking
      rules:
        - alert: TrackingIngestionBadEvents
          # Any sustained schema-rejected event is a contract violation between
          # an emitter (workflow/adapters) and the domain schema. A low but
          # steady drip (2-4/h) is exactly how the occurredAt number bug hid
          # below TrackingIngestionBacklog's >1/s threshold for weeks.
          expr: sum(increase(shipping_tracking_events_total{outcome="bad-event"}[1h])) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'tracking-ingestion is rejecting events (bad-event)'
            description: '{{ $value }} schema-rejected tracking events in the last hour. An emitter violates the TrackingEventReceived contract — check tracking-ingestion logs for "tracking.ingestion.bad-event" reasons.'
        - alert: TrackingIngestionBacklog
          expr: sum(rate(shipping_tracking_events_total{outcome=~"bad-event|transient"}[10m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'tracking-ingestion failing >1/sec'
            description: 'Sustained bad-event or transient outcomes on tracking-ingestion. Runbook §5.'
        - alert: TrackingIngestionSilent
          # Low-volume periods with zero candidate shipments are normal; only
          # alert when ingestion is silent while the NATS consumer is unhealthy
          # or has backlog waiting to be delivered.
          expr: |
            (max(tracking_ingestion_nats_connected) == 0)
            or
            (max(tracking_ingestion_consumer_pending) > 0 and sum(rate(shipping_tracking_events_total[30m])) == 0)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'tracking-ingestion silent with unhealthy consumer/backlog'
            description: 'tracking-ingestion is not processing events while NATS is disconnected or the JetStream consumer has pending messages. Check NATS consumer state/runbook §5.'
    - name: skirmshop-labels-synapse
      rules:
        - alert: SynapseOrphanIndexEntries
          expr: synapse_redis_orphan_index_entries_total > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'Synapse index has {{ $value }} orphan entries'
            description: 'workflow-instances.synapse.io has index fields pointing at missing keys — can crash labels-synapse-operator. Runbook §3.'
        - alert: LabelGenerationStuck
          expr: labels_manual_label_stuck_total > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: '{{ $value }} shipment-label workflow(s) stuck non-terminal'
            description: 'generate-shipment-label launched but not terminal beyond threshold. Check operator health + poll backlog. Runbook §1.'
        - alert: SynapsePollFaultedBacklog
          expr: sum(synapse_redis_workflow_instances_total{workflow="poll-tracking",phase="faulted"}) > 500
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'poll-tracking faulted backlog >500'
            description: 'Faulted poll-tracking instances accumulating ({{ $value }}). Confirm poll-tracking v1.3.1 + scheduler guards. Runbook §2.'
        - alert: SynapseJanitorStalled
          expr: time() - max(synapse_cleanup_last_run_timestamp_seconds) > 3600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'synapse-janitor has not completed a pass in >1h'
            description: 'Backlog will grow unchecked. Check the synapse-janitor deployment. Runbook §6.'
        - alert: SynapseJanitorArchiveFailing
          expr: increase(synapse_cleanup_archive_failed_total[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: 'synapse-janitor archive failures'
            description: '{{ $value }} archive failures in 15 min — deletes skipped (safe) but backlog will not drain. Check Postgres. Runbook §6.'
        - alert: SynapseOperatorRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="skirmshop",pod=~"labels-synapse-operator.*"}[15m]) > 2
          labels:
            severity: critical
          annotations:
            summary: 'labels-synapse-operator restarting'
            description: '{{ $value }} restarts in 15 min — likely choking on the workflow-instance backlog. Check orphan entries + poll backlog. Runbook §3.'
        - alert: LabelsValkeyMetricsMissing
          expr: absent(redis_up{job="labels-valkey-headless"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'labels-valkey metrics are missing'
            description: 'No redis_up series for labels-valkey for 5m. The redis_exporter scrape is failing or the labels-valkey pods are down.'
        - alert: LabelsValkeyScrapeTargetsLow
          expr: count(redis_up{job="labels-valkey-headless"}) < 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'labels-valkey has fewer than 3 scrape targets'
            description: 'VictoriaMetrics sees {{ $value }} labels-valkey exporter target(s); expected 3 pods.'
        - alert: LabelsValkeyExporterDown
          expr: redis_up{job="labels-valkey-headless"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: 'labels-valkey exporter cannot reach Valkey'
            description: 'Exporter target {{ $labels.pod }} reports redis_up=0 for 2m.'
        - alert: LabelsValkeyMasterCountInvalid
          expr: (count(redis_instance_info{job="labels-valkey-headless",role="master"}) or vector(0)) != 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: 'labels-valkey master count is invalid'
            description: 'Expected exactly one labels-valkey master; current master count is {{ $value }}.'
        - alert: LabelsValkeyMemoryHigh
          # labels-valkey has maxmemory=0/noeviction; the practical ceiling is the
          # valkey container limit (2Gi since 15-10, was 1Gi since 17-09 and 512Mi
          # before). Alert below that cliff so document/poll backlog growth is
          # visible before OOM/failover pressure. The underlying growth of
          # document-* (no TTL, no age source) is NOT fixed by this threshold:
          # see docs/labels-valkey-remediation-plan-2026-07-01.md Card A.
          # INFRA-882: medido 16-10, max de used_memory en 7d = 891MiB (~934MB dec),
          # estable 858->890. SC-2231 (15-10) ya subio el umbral 700->1400 (el flapeo
          # que vio el triaje era el 700 viejo). Se sube a 1600MiB: margen extra para el
          # crecimiento lento del cache (noeviction, ~8MiB/dia) y sigue por debajo del
          # cliff de 2Gi (2048MiB), con ~448MiB de colchon antes de presion OOM.
          expr: max(redis_memory_used_bytes{job="labels-valkey-headless"}) > 1600 * 1024 * 1024
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'labels-valkey memory is above 1600Mi'
            description: 'labels-valkey used_memory is {{ $value | humanize1024 }} for 15m. With noeviction and a 2Gi valkey container limit, growth can become OOM/failover pressure.'
        - alert: LabelsValkeyMemoryGrowth
          # INFRA-882: el 50MiB disparaba con el crecimiento normal de cache. Medido
          # 16-10, el delta max-min de 24h en regime normal es de ~24-96MiB. El umbral
          # sube a 300MiB/24h para dejar fuera ese ruido. Ojo: la expr resta el max de
          # UN nodo menos el min de OTRO, asi que un resync de una replica (hoy 16-10 un
          # nodo cayo a 306MiB y subio a 890 -> delta 584MiB) la dispara; eso es un evento
          # real de repli, no crecimiento de cache, y por eso se deja margen hasta 300.
          # SC-2506: el margen de 300 no cubre el artefacto (584MiB > 300), y el incidente
          # LBL-14496 volvio a disparar con el mismo patrón tras los reinicios del 16-10
          # (04:12-06:31). Puerta de uptime: la regla solo evalua si las 3 instancias
          # llevan >=24h vivas, es decir, la ventana esta limpia de reinicios/resyncs.
          # Medido en vivo: con la puerta el delta 585MiB queda suprimido; simulando la
          # puerta superada la alerta sigue disparando con ese valor. El crecimiento real
          # de cache (~8MiB/dia) nunca alcanza 300MiB en 24h, asi que nada se pierde;
          # caidas de repli las cubren LabelsValkeyExporterDown y ScrapeTargetsLow.
          expr: |
            (
              max(max_over_time(redis_memory_used_bytes{job="labels-valkey-headless"}[24h]))
              -
              min(min_over_time(redis_memory_used_bytes{job="labels-valkey-headless"}[24h]))
            ) > 300 * 1024 * 1024
            and on()
            count(redis_uptime_in_seconds{job="labels-valkey-headless"} >= 86400) >= 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'labels-valkey memory grew by more than 300Mi in 24h'
            description: 'labels-valkey memory grew by {{ $value | humanize1024 }} over 24h. Check document-* and poll-* retention backlog before it reaches the 2Gi container limit.'
        - alert: LabelsValkeyEvictions
          expr: sum(increase(redis_evicted_keys_total{job="labels-valkey-headless"}[10m])) > 0
          labels:
            severity: critical
          annotations:
            summary: 'labels-valkey is evicting keys'
            description: 'labels-valkey evicted {{ $value }} key(s) in the last 10m. This datastore is expected to run noeviction; investigate maxmemory policy drift immediately.'
        - alert: LabelsValkeyRejectedConnections
          expr: sum(increase(redis_rejected_connections_total{job="labels-valkey-headless"}[5m])) > 0
          labels:
            severity: critical
          annotations:
            summary: 'labels-valkey rejected connections'
            description: 'labels-valkey rejected {{ $value }} connection(s) in the last 5m. Check capacity and client pressure.'
        # ── Consumer resilience (PR skirmshop-labels#37, 2026-06-11) ──
        # The 9h silent-mute incident: NATS leader change killed the JetStream
        # iterator and nothing noticed. These three make the failure mode loud.
        - alert: TrackingIngestionNatsDown
          expr: max(tracking_ingestion_nats_connected) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'tracking-ingestion lost its NATS connection'
            description: 'tracking_ingestion_nats_connected has been 0 for 5 min — no tracking events are being consumed. The supervisor should resubscribe or exit; if the pod is Running but mute, check labels-nats-cluster health and the consumer logs (tracking-ingestion.nats.*).'
        - alert: TrackingIngestionResubscribeStorm
          expr: increase(tracking_ingestion_consumer_resubscribes_total[15m]) > 3
          labels:
            severity: warning
          annotations:
            summary: 'tracking-ingestion consumer resubscribing repeatedly'
            description: '{{ $value }} JetStream resubscribes in 15 min — the SHIPPING_EVENTS consumer keeps dying (NATS leader flapping or consumer deleted). Check labels-nats-cluster pods and tracking-ingestion.consumer.resubscribed logs.'
        - alert: TrackingIngestionBacklogStuck
          expr: min_over_time(tracking_ingestion_consumer_pending[30m]) > 25
          labels:
            severity: warning
          annotations:
            summary: 'tracking-ingestion backlog not draining'
            description: 'The JetStream consumer has kept >25 pending messages for 30 min straight — consuming slower than the polls publish, or stuck without dying. /ready should already be 503 (idle-with-backlog); check why k8s has not recycled the pod.'
    # ── Public tracking page health (shopify-app /metrics, added 2026-06-23) ──
    # ROUTING: alertmanager blackholes severity=warning; only non-warning alerts
    # reach the Synapse webhook, which dispatches to Telegram by the channel /
    # telegram_topic labels. So this alert is severity=critical + channel=telegram
    # + telegram_topic=6921 (Labels). Depends on the labels-shopify-app
    # VMServiceScrape (above) actually landing http_request_duration_seconds.
    - name: skirmshop-labels-public-tracking
      rules:
        - alert: TrackingPage404Spike
          # The customer-facing tracking page is route="/track/:trackingNumber"
          # (templated; /apps/track.* kept for forward-compat but matches nothing
          # today). A low 404 trickle is normal (mistyped/expired tracking links),
          # so we alert only on a sustained spike: >0.05 req/s of 404s over 15m
          # (~45 404s in 15 min) held for 15m. A jump like that means the public
          # page broke (bad deploy, token resolver down, route regression) and
          # customers can't see their tracking — the ORD18525-adjacent "customer
          # sees nothing" failure mode.
          # NB: the metric's app-set `service="shopify-app"` label collides with the
          # scrape target label and is demoted to `exported_service`; the effective
          # `service` label is the k8s Service name `labels-shopify-app`. Verified in
          # VictoriaMetrics (service="labels-shopify-app", exported_service="shopify-app").
          expr: |
            sum(rate(http_request_duration_seconds_count{service="labels-shopify-app",route=~"/track/.*|/apps/track.*",status="404"}[15m])) > 0.05
          for: 15m
          labels:
            severity: critical
            channel: telegram
            telegram_topic: "6921"
          annotations:
            summary: 'Public tracking page 404 spike ({{ $value | printf "%.2f" }}/s)'
            description: 'The public tracking routes (/track/:trackingNumber) are returning 404 at {{ $value | printf "%.2f" }} req/s sustained over 15m (threshold 0.05/s). The customer tracking page is likely broken — check labels-shopify-app logs/deploy and the public-tracking token resolver. Compare with the 200 rate on the same route.'
    # Result and heartbeat of the active deep monitor. These are severity=warning
    # by design and require the explicit alertname route in k8s-observability;
    # channel/topic labels alone do not select an Alertmanager receiver.
    - name: skirmshop-labels-deep-monitor
      rules:
        - alert: LabelsDeepMonitorIncident
          expr: |
            last_over_time(
              labels_deep_monitor_check_ok{
                job="labels_deep_monitor",
                namespace="skirmshop",
                cronjob="labels-deep-monitor"
              }[2h]
            ) == 0
          for: 1m
          labels:
            severity: warning
            area: labels
            domain: crons
          annotations:
            summary: 'labels-deep-monitor detectó un incidente'
            description: 'El último probe completo encontró un incidente. Consultar los logs del Job exitoso más reciente de skirmshop/labels-deep-monitor.'
        - alert: LabelsDeepMonitorMissing
          expr: |
            (
              time() -
              last_over_time(
                labels_deep_monitor_last_run_timestamp_seconds{
                  job="labels_deep_monitor",
                  namespace="skirmshop",
                  cronjob="labels-deep-monitor"
                }[2h]
              ) > 35 * 60
            )
            or
            absent_over_time(
              labels_deep_monitor_last_run_timestamp_seconds{
                job="labels_deep_monitor",
                namespace="skirmshop",
                cronjob="labels-deep-monitor"
              }[2h]
            )
          for: 5m
          labels:
            severity: warning
            area: labels
            domain: crons
          annotations:
            summary: 'labels-deep-monitor no publica heartbeat'
            description: 'No existe un resultado completo reciente del probe. Revisar CronJob, acceso Kubernetes y entrega a VictoriaMetrics.'
    # SKIRM-316. Recargo de combustible de CEX y Correos: el watchdog labels-fuel-freshness
    # publica cada día si la vigencia de cada transportista es del mes (antes del día 8 vale
    # la del anterior) y fuel-sync.yml publica el resultado de cada run. Nombres `Labels*`:
    # la regla de correlación `labels-pipeline` de Keep abre el incidente.
    - name: skirmshop-labels-fuel
      rules:
        - alert: LabelsFuelSurchargeStale
          expr: |
            last_over_time(
              labels_fuel_surcharge_fresh{job="labels_fuel_freshness", namespace="skirmshop"}[26h]
            ) == 0
          for: 1m
          labels:
            severity: warning
            area: labels
            domain: crons
          annotations:
            summary: 'Recargo fuel de {{ $labels.carrier }} sin aplicar este mes'
            description: 'labels-{{ $labels.carrier }}-surcharges tiene una vigencia de un mes anterior. fuel-sync.yml no ha encontrado el email de CEX o la factura de Correos de este mes en info@skirmshop.es: revisar el buzón y el último run del workflow en k8s-shopify-label-pocharlies.'
        - alert: LabelsFuelFreshnessMissing
          expr: |
            (
              time() - last_over_time(
                labels_fuel_freshness_last_run_timestamp_seconds{job="labels_fuel_freshness", namespace="skirmshop"}[3d]
              ) > 26 * 3600
            )
            or
            absent_over_time(
              labels_fuel_freshness_last_run_timestamp_seconds{job="labels_fuel_freshness", namespace="skirmshop"}[3d]
            )
          for: 30m
          labels:
            severity: warning
            area: labels
            domain: crons
          annotations:
            summary: 'labels-fuel-freshness no publica heartbeat'
            description: 'Sin resultado del watchdog del recargo fuel en 26 h: nadie está mirando la vigencia del recargo. Revisar el CronJob skirmshop/labels-fuel-freshness y la entrega a VictoriaMetrics.'
        - alert: LabelsFuelSyncFailed
          expr: |
            last_over_time(
              labels_fuel_sync_ok{job="labels_fuel_sync", namespace="skirmshop"}[26h]
            ) == 0
          for: 1m
          labels:
            severity: warning
            area: labels
            domain: crons
          annotations:
            summary: 'fuel-sync falló en su último run'
            description: 'El workflow fuel-sync.yml de k8s-shopify-label-pocharlies falló (Gmail, parseo de email/factura o commit a main). El recargo vigente sigue siendo el anterior: revisar el log del último run.'
        - alert: LabelsFuelSyncMissing
          expr: |
            (
              time() - last_over_time(
                labels_fuel_sync_last_run_timestamp_seconds{job="labels_fuel_sync", namespace="skirmshop"}[3d]
              ) > 26 * 3600
            )
            or
            absent_over_time(
              labels_fuel_sync_last_run_timestamp_seconds{job="labels_fuel_sync", namespace="skirmshop"}[3d]
            )
          for: 30m
          labels:
            severity: warning
            area: labels
            domain: crons
          annotations:
            summary: 'fuel-sync no ha corrido en 26 h'
            description: 'El workflow programado fuel-sync.yml no publica resultado: deshabilitado por GitHub, sin runners arc-k8s o sin red a VictoriaMetrics. Revisar GitHub Actions de k8s-shopify-label-pocharlies.'
