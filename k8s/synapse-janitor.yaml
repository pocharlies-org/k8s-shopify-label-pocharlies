# synapse-janitor — conservative LIVE cleanup for Synapse workflow instances.
# CURRENT STATE (not observe-only): ships CLEANUP_ENABLED=true + CLEANUP_DRY_RUN=false
# (see the env below). Each pass scans the workflow-instance backlog, exposes
# metrics + logs the pass census, and archives-then-deletes ONLY terminal instances
# older than the retention windows below (protects <6h instances + generate-shipment-
# label). Proven safe by the one-time remediation (3663 -> 980 instances,
# archiveFailed=0). This image also removes the poll-tracking companion payload,
# metadata, and text-documents-list member only when that same poll-tracking instance
# is archived+deleted by the janitor. It does NOT cover document-* or historical
# poll-* bulk retention — see docs/labels-valkey-remediation-plan-2026-07-01.md.
# Connects to the HA Valkey master endpoint labels-valkey-master (REDIS_URL).
# See app repo docs/RUNBOOK-synapse-cleanup.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labels-synapse-janitor
  namespace: skirmshop
  labels:
    app: labels-synapse-janitor
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: labels-synapse-janitor
  # RollingUpdate (SKIRM-237): el pod viejo sigue limpiando mientras sauvage baja la imagen nueva. Al cambiar de pod
  # coinciden dos janitors unos segundos: el archivo es un upsert y un borrado repetido solo falla en ese ciclo.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app: labels-synapse-janitor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - effect: NoSchedule
          key: role
          operator: Equal
          value: edge
      containers:
        - name: synapse-janitor
          image: harbor.e-dani.com/homelab/skirmshop-labels-synapse-janitor@sha256:588a74b57ea786b67978c12ab33cbd71ddfff21e248968cd6801a087a85b91cd # pin por digest — SKIRM-236: repin a v2026.10.21.8 (skirmshop-labels b892190, release 39643747498); mismo código que el pin anterior (ab4c640, tag v2026.09.07.2): solo se alinea a la release.
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: labels-secrets # DB_USER / DB_PASSWORD
          env:
            - name: PORT
              value: "3000"
            - name: PG_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/labels
            - name: REDIS_URL
              value: redis://labels-valkey-master.skirmshop.svc.cluster.local:6379
            - name: SYNAPSE_INDEX_KEY
              value: workflow-instances.synapse.io
            # --- STEADY-STATE LIVE cleanup (conservative retention) ---
            # Drains terminal instances older than retention; protects <6h + gsl.
            # Proven safe by the one-time remediation (3663→980, 0 archiveFailed).
            - name: CLEANUP_ENABLED
              value: "true"
            - name: CLEANUP_DRY_RUN
              value: "false"
            - name: CLEANUP_MIN_AGE_HOURS
              value: "6"
            - name: CLEANUP_RETENTION_COMPLETED_HOURS
              value: "24"
            - name: CLEANUP_RETENTION_FAULTED_HOURS
              value: "48"
            - name: CLEANUP_RETENTION_PENDING_POLL_HOURS
              value: "24"
            - name: CLEANUP_INTERVAL_SECONDS
              value: "900"
            - name: ORPHAN_GRACE_SECONDS
              value: "120"
            - name: MANUAL_LABEL_STUCK_MINUTES
              value: "15"
            # A `running` generate-shipment-label instance with no task
            # transition for this long is faulted with a recorded error
            # (dead Synapse engine — ORD18918). Must exceed the PT2M
            # carrier-confirmation listen; 0 disables.
            - name: STALLED_LABEL_MINUTES
              value: "10"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: labels-synapse-janitor
  namespace: skirmshop
  labels:
    app: labels-synapse-janitor
spec:
  selector:
    app: labels-synapse-janitor
  ports:
    - name: http
      port: 3000
      targetPort: 3000
