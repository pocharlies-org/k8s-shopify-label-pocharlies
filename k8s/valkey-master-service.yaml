# =============================================================================
# Valkey master-tracking Service — stable standalone master endpoint.
# =============================================================================
# Synapse alpha1 (Neuroglia/StackExchange.Redis) does NOT work in Sentinel-
# discovery mode (it assumes a standalone Redis; pointing it at a sentinel
# endpoint left it persisting nothing + SIGSEGV). So instead of asking the
# client to do Sentinel, we expose a stable endpoint that ALWAYS points at the
# current Valkey master, and Synapse connects to it as a plain standalone Redis
# (labels-valkey-master:6379). Valkey+Sentinel still does the actual failover;
# this just keeps the Service Endpoints pointing at whoever is master.
#
# SC-5880: a small labeler (image harbor.e-dani.com/homelab/valkey-master-labeler,
# built in k8s-infra-pocharlies databases/valkey-master-labeler) stamps
# `valkey-role=master` on the pod Sentinel reports as master and removes the
# label from the rest; the Service selects valkey-role=master. It is
# event-driven and level-triggered — startup read of
# `SENTINEL get-master-addr-by-name labels-master`, SUBSCRIBE `+switch-master`
# and a Kubernetes watch of the pods (a recreated pod is born without the
# label) — with no clock loop. On failover the Service follows at once.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey-master-labeler
  namespace: skirmshop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: valkey-master-labeler
  namespace: skirmshop
rules:
  # SC-5880: reducción de privilegio. Cae `pods/exec` (ya no se hace
  # `kubectl exec <pod> -- valkey-cli role`): la pregunta va a Sentinel
  # (`SENTINEL get-master-addr-by-name`). El watch de pods pide `watch`.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: valkey-master-labeler
  namespace: skirmshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: valkey-master-labeler
subjects:
  - kind: ServiceAccount
    name: valkey-master-labeler
    namespace: skirmshop
---
apiVersion: v1
kind: Service
metadata:
  name: labels-valkey-master
  namespace: skirmshop
  labels:
    app: labels-valkey-master
spec:
  # Selects ONLY the pod currently labelled master → stable standalone endpoint.
  selector:
    app: labels-valkey
    valkey-role: master
  ports:
    - { name: valkey, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labels-valkey-master-labeler
  namespace: skirmshop
  labels:
    app: labels-valkey-master-labeler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labels-valkey-master-labeler
  template:
    metadata:
      labels:
        app: labels-valkey-master-labeler
    spec:
      serviceAccountName: valkey-master-labeler
      enableServiceLinks: false
      nodeSelector: { workload: core }
      containers:
        # SC-5880: componente único (imagen construida en k8s-infra-pocharlies,
        # databases/valkey-master-labeler). Level-triggered: lectura de Sentinel
        # al arrancar, SUBSCRIBE `+switch-master` y watch de los pods; sin bucle
        # de reloj. labels-valkey no pone requirepass en Sentinel, así que no
        # hay SENTINEL_PASSWORD. Falta fijar el digest tras el primer build
        # (INFRA-1300). No hay NetworkPolicy en skirmshop que acote el 26379:
        # nada que abrir aquí.
        - name: labeler
          image: harbor.e-dani.com/homelab/valkey-master-labeler:v1@sha256:6997a0ca91c41c8902abfe64294a772aabdb5625267d76b06b43eb00923f515a
          env:
            - { name: NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: MASTER_NAME, value: labels-master }
            - { name: SENTINEL_HOST, value: labels-valkey-sentinel }
            - { name: SENTINEL_PORT, value: "26379" }
            - { name: POD_SELECTOR, value: app=labels-valkey }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
