name: CI

# Un solo run por PR: el push de ramas duplicaba el de pull_request (la
# concurrencia agrupa por github.ref, distinto en ambos eventos, y no se
# cancelaban). push queda solo para el tronco.
on:
  pull_request:
  push:
    branches: [main]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-monitor-contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - name: Test deep-monitor result/delivery separation
        run: bash tests/deep-monitor-contract.sh

  standard:
    needs: [deep-monitor-contract]
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-ci.yml@main
    with:
      runner: arc-k8s
      run_node: false
      run_docker_build: false
      kustomize_paths: ". k8s"
    secrets: inherit
