name: Recargo fuel

# SKIRM-312. Aplica el recargo de combustible de CEX (email mensual) y Correos matriz (factura mensual)
# desde Gmail a k8s/cex-config.yaml y k8s/correos-surcharges.yaml, y lo commitea a main: ArgoCD lo
# despliega y el adapter lo relee en cada /rate. Corre cada día porque el email y la factura llegan en
# días variables; en la práctica commitea una vez al mes por transportista (idempotente por Gmail id).
# Cada run publica su resultado en VictoriaMetrics (LabelsFuelSyncFailed/Missing → Keep, SKIRM-316);
# si un mes no llega nada, el watchdog labels-fuel-freshness lo publica y avisa LabelsFuelSurchargeStale.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - name: pdftotext
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Leer Gmail y aplicar
        id: sync
        env:
          # Solo gmail.readonly sobre info@e-dani.com (alias info@skirmshop.es); lo escribe security.
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_FUEL_TOKEN_JSON }}
        run: python3 scripts/fuel_sync.py
      - name: Commit a main
        id: commit
        if: always() && steps.sync.outputs.summary != ''
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "labels-fuel-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "chore(labels): recargo fuel — ${SUMMARY}" -m "SKIRM-312: aplicado por .github/workflows/fuel-sync.yml desde Gmail."
          git pull -q --rebase origin main
          git push -q origin HEAD:main
      - name: Publicar el resultado
        if: always()
        env:
          OK: ${{ steps.sync.outcome == 'success' && steps.commit.outcome != 'failure' && '1' || '0' }}
          VM_URL: http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
        run: |
          ts=$(date +%s)
          printf 'labels_fuel_sync_ok{namespace="skirmshop",workflow="fuel-sync"} %s %s000\nlabels_fuel_sync_last_run_timestamp_seconds{namespace="skirmshop",workflow="fuel-sync"} %s %s000\n' "$OK" "$ts" "$ts" "$ts" \
            | curl -fsS -m 15 --retry 3 -H 'Content-Type: text/plain' --data-binary @- "$VM_URL/api/v1/import/prometheus?extra_label=job=labels_fuel_sync"
          echo "labels_fuel_sync_ok=$OK"
